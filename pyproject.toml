[project]
name = "csbench"
version = "0.1.0"
description = "Benchmark harness that tests LLMs on CS assignments."
requires-python = ">=3.12"
dependencies = [
  "anthropic (>=2.9.0,<3.0.0)",
  "attrs (>=26.1.0,<27.0.0)",
  "openai (>=3.46.0,<4.0.0)",
  "pycodestyle (>=2.15.0,<3.0.0)",
  "python-dotenv (>=1.2.4,<2.0.0)",
]

[project.scripts]
csbench = "csbench.cli:main"

[tool.poetry]
packages = [{ include = "csbench" }]

[tool.poetry.group.dev.dependencies]
black = "^26.10.1"
mypy = "^2.4.1"

[tool.black]
target-version = ["py312"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["csbench"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
include = ["csbench"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
